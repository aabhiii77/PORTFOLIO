[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/src/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*.js"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*.mjs"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*.css"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

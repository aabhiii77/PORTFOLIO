services:
  - type: web
    name: aayushi-portfolio-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        value: aayushikoomar@gmail.com
      - key: SMTP_APP_PASSWORD
        sync: false
      - key: CONTACT_RECIPIENT_EMAIL
        value: aayushikoomar@gmail.com
      - key: SMTP_TIMEOUT_SECONDS
        value: "15"
      - key: ALLOWED_ORIGINS
        sync: false
